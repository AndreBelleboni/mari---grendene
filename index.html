<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Operação - Maristela</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Dados Operação - Maristela</h1>
        <button onclick="logout()" id="btnLogout">Sair</button>
    </header>

    <main>
        <div class="container">
            <h2>➕ Registrar Atendimento</h2>
            <div class="grid-inputs">
                <input type="text" id="nome" placeholder="Nome do Liderado" list="listaNomes" autocomplete="off">
                <datalist id="listaNomes"></datalist>

                <input type="date" id="data">
                <input type="number" id="chat" placeholder="Volume Chat">
                <input type="number" id="inbox" placeholder="Volume Inbox">
                
                <input type="text" id="csatOperacional" placeholder="CSAT Operacional %">
                <input type="text" id="csat" placeholder="CSAT Atendimento %">
                
                <button onclick="salvarDados()">Salvar Dados</button>
            </div>
        </div>

        <div class="container">
            <h2>🔍 Filtros Avançados</h2>
            <div class="grid-inputs">
                <div style="flex: 1; min-width: 250px;">
                    <label class="label-filtro">Selecionar Equipe:</label>
                    <div id="containerCheckboxes" class="lista-checkbox"></div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
                    <label class="label-filtro">Período:</label>
                    <input type="date" id="dataInicio" onchange="filtrar()">
                    <input type="date" id="dataFim" onchange="filtrar()">

                    <label class="label-filtro">Classificar tabela por:</label>
                    <select id="ordenacao" onchange="filtrar()">
                        <option value="data_asc">Data (Mais Antigo)</option>
                        <option value="data_desc">Data (Mais Novo)</option>
                        <option value="alfabetica">Ordem Alfabética</option>
                        <option value="maior">Maior Volume</option>
                        <option value="menor">Menor Volume</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch;">
                    <button onclick="filtrar()" class="btn-aplicar">Aplicar Filtros</button>
                    <button class="btn-limpar" onclick="limparFiltros()">Limpar Filtros</button>
                    <button onclick="excluirAtendenteCompleto()" class="btn-perigo">🗑️ Excluir Atendente</button>
                </div>
            </div>
        </div>

        <div id="secaoResultados" class="container" style="display: none;">
            <h2>📊 Performance e Evolução</h2>

            <div style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; background: #f9f9f9; padding: 10px; border-radius: 8px;">
                <label class="label-switch">
                    <input type="checkbox" id="exibirGrafico" checked onchange="toggleGrafico()">
                    <span>📈 Gráfico de Evolução</span>
                </label>
                <label class="label-switch">
                    <input type="checkbox" id="exibirTabela" checked onchange="togglePerformance()">
                    <span>📋 Tabela de Performance</span>
                </label>
            </div>

            <div id="containerDoGrafico" class="container-grafico">
                <canvas id="graficoEvolucao"></canvas>
            </div>

            <div id="containerPerformance">
                <table>
                    <thead>
                        <tr>
                            <th>NOME</th>
                            <th>DATA</th>
                            <th>CHAT</th>
                            <th>INBOX</th>
                            <th>TOTAL</th>
                            <th>CSAT - OPERACIONAL</th>
                            <th>CSAT - ATENDIMENTO</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>

                <div id="painelMedia" class="card-media">
                    <div class="grid-metricas">
                        <div><small>Total Chat</small><h3 id="totalChatPeriodo">0</h3></div>
                        <div><small>Total Inbox</small><h3 id="totalInboxPeriodo">0</h3></div>
                        <div><small>Volume Geral</small><h3 id="totalGeralPeriodo">0</h3></div>
                        <div><small>Média Vol. Diário</small><h3 id="valorMedia" class="destaque-media">0</h3></div>
                        <div><small>CSAT Operacional</small><h3 id="mediaCsatOpRecente" class="destaque-media">0%</h3></div>
                        <div><small>CSAT Atendimento</small><h3 id="mediaCsatAtRecente" class="destaque-media">0%</h3></div>
                    </div>
                    <hr class="divisor">
                    <div id="resumoIndividual"></div>
                    <button onclick="gerarRelatorio()" class="btn-relatorio">📄 Gerar Relatório (PDF)</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
